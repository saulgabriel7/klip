<!doctype html>
<html lang="en" class="dark" data-app-mode="%MODE%">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://tally.so; frame-src https://tally.so; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' ws: http://localhost:*" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Klip</title>
    <style>
      :root {
        --boot-splash-bg: #09090b;
        --boot-splash-ink: #fafafa;
        --boot-splash-muted: #a1a1aa;
        --boot-splash-bar-track: rgba(255, 255, 255, 0.08);
        --boot-splash-brand: #3b82f6;
        --boot-splash-glow: transparent;
        color-scheme: dark;
        background: var(--boot-splash-bg);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --boot-splash-bg: #fafafa;
          --boot-splash-ink: #09090b;
          --boot-splash-muted: #52525b;
          --boot-splash-bar-track: rgba(9, 9, 11, 0.1);
          --boot-splash-brand: #18181b;
          --boot-splash-glow: transparent;
          color-scheme: light;
        }

        .boot-splash__mascot {
          filter: none;
        }
      }

      html[data-boot-splash-theme='dark'] {
        --boot-splash-bg: #09090b;
        --boot-splash-ink: #fafafa;
        --boot-splash-muted: #a1a1aa;
        --boot-splash-bar-track: rgba(255, 255, 255, 0.08);
        --boot-splash-brand: #3b82f6;
        --boot-splash-glow: transparent;
        color-scheme: dark;
      }

      html[data-boot-splash-theme='light'] {
        --boot-splash-bg: #fafafa;
        --boot-splash-ink: #09090b;
        --boot-splash-muted: #52525b;
        --boot-splash-bar-track: rgba(9, 9, 11, 0.1);
        --boot-splash-brand: #18181b;
        --boot-splash-glow: transparent;
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--boot-splash-bg);
      }

      #root {
        min-height: 100vh;
      }

      /* Laid out as the app's splash is (.splash-overlay): the mascot, the name
         and a line held for the setup heading sit in the middle row, and the
         status hangs below, so nothing moves when the app's splash takes over. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        padding: 24px;
        overflow: hidden;
        background: var(--boot-splash-bg);
        color: var(--boot-splash-ink);
        font-family: Poppins, "Noto Sans Khmer", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      html[data-app-mode='browser-mock'] #boot-splash {
        display: none;
      }

      html[data-app-mode='browser-mock'][data-boot-splash-preview='true'] #boot-splash {
        display: grid;
      }

      .boot-splash__anchor {
        grid-row: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .boot-splash__mascot {
        width: 132px;
        height: 132px;
        margin-bottom: 6px;
        object-fit: contain;
        filter: invert(1);
      }

      html[data-boot-splash-theme='light'] .boot-splash__mascot {
        filter: none;
      }

      html[data-boot-splash-theme='dark'] .boot-splash__mascot {
        filter: invert(1);
      }

      .boot-splash__heading {
        height: 21px;
      }

      .boot-splash__text {
        grid-row: 3;
        align-self: start;
        display: flex;
        width: min(300px, 100%);
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 16px;
        text-align: center;
      }

      .boot-splash__brand {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 0;
      }

      .boot-splash__status {
        margin: 0;
        color: var(--boot-splash-muted);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.45;
      }

      .boot-splash__bar {
        position: relative;
        width: 176px;
        height: 3px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-splash-bar-track);
      }

      .boot-splash__bar::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 52%;
        border-radius: inherit;
        background: var(--boot-splash-brand);
        box-shadow: 0 0 12px var(--boot-splash-glow);
        animation: boot-splash-progress 1.05s ease-in-out infinite;
      }

      @keyframes boot-splash-progress {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(205%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::before {
          animation: none;
          transform: none;
          width: 100%;
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite" aria-label="Starting Klip">
        <div class="boot-splash__anchor">
          <img src="/mascot-main.png" alt="" class="boot-splash__mascot" />
          <p class="boot-splash__brand">Klip</p>
          <div class="boot-splash__heading"></div>
        </div>
        <div class="boot-splash__text">
          <p class="boot-splash__status">Starting Klip</p>
          <div class="boot-splash__bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
